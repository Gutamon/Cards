<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>父親節賀卡</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --navy: #2E4A62;
            --navy-light: #A9C2D6;
            --navy-pale: #EEF3F7;
            --gold: #B8863E;
            --gold-light: #E9D5AC;
            --cream: #F5F1E8;
            --brown: #4A3A2A;
            --forest: #4F6B52;
            --forest-light: #CFDECF;
        }

        html,
        body {
            height: 100%;
            background: var(--cream);
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            /* 禁止選取文字 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* ── SCENE ── */
        .scene {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.25rem;
            position: relative;
        }

        /* Background shapes */
        .bg-petal {
            position: fixed;
            border-radius: 50% 0 50% 0;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        .bp1 {
            width: 180px;
            height: 180px;
            background: var(--navy);
            top: -40px;
            right: -40px;
            transform: rotate(20deg);
        }

        .bp2 {
            width: 120px;
            height: 120px;
            background: var(--gold);
            bottom: 10%;
            left: -30px;
            transform: rotate(-30deg);
        }

        .bp3 {
            width: 90px;
            height: 90px;
            background: var(--navy);
            bottom: 30%;
            right: -20px;
            transform: rotate(10deg);
            border-radius: 0 50% 0 50%;
        }

        .bp4 {
            width: 60px;
            height: 60px;
            background: var(--forest);
            top: 30%;
            left: 5%;
            transform: rotate(45deg);
            border-radius: 50%;
        }

        /* ── ENVELOPE ── */
        .envelope-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            perspective: 1000px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), padding-top 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            padding-top: 40px;
            margin-top: auto;
            margin-bottom: auto;
        }

        .envelope-wrap.up {
            padding-top: 700px;
        }

        .envelope {
            position: relative;
            width: 100%;
            aspect-ratio: 1.6 / 1;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 8px 24px rgba(46, 74, 98, 0.2));
            z-index: 2;
        }

        .envelope:hover {
            transform: scale(1.02);
        }

        .envelope:active {
            transform: scale(0.98);
        }

        .env-body {
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, #EDE4D2 0%, #E0D2B4 100%);
            border-radius: 8px;
            border: 1.5px solid #C9B58C;
            z-index: 1;
        }

        /* Flap */
        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 52%;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
            z-index: 4;
        }

        .env-flap-front {
            position: absolute;
            inset: 0;
            background: linear-gradient(170deg, #DFCBA2 0%, #D2B989 100%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border: 1.5px solid #C9B58C;
            backface-visibility: hidden;
            z-index: 2;
        }

        .env-flap-inner {
            position: absolute;
            inset: 0;
            background: linear-gradient(170deg, #EEE2C9 0%, #E4CFAB 100%);
            /* 內側的形狀預設為尖端向上，這樣翻轉 180 度後會與外側重合，展開時則正確向上 */
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
            transform: rotateX(180deg);
            transform-origin: center;
            backface-visibility: hidden;
            z-index: 1;
        }

        /* Envelope bottom triangles */
        .env-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            background: linear-gradient(0deg, #C7AC7E 0%, #DBC196 100%);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            z-index: 3;
        }

        .env-left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 52%;
            background: linear-gradient(90deg, #CEB187 0%, #E0C79E 100%);
            clip-path: polygon(0 0, 100% 50%, 0 100%);
            z-index: 3;
        }

        .env-right {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 52%;
            background: linear-gradient(-90deg, #CEB187 0%, #E0C79E 100%);
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
            z-index: 3;
        }

        /* Wax seal */
        .wax-seal {
            position: absolute;
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            background: radial-gradient(circle at 40% 35%, #3E5F7D, #223C52);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #2E4A62;
            box-shadow: 0 2px 8px rgba(34, 60, 82, 0.4);
            z-index: 10;
            transition: transform 0.2s ease;
            font-family: 'Noto Serif TC', serif;
            font-size: 18px;
            color: rgba(232, 224, 205, 0.95);
            letter-spacing: 0.02em;
        }

        .envelope.open {
            transform: translateY(-40px);
        }

        .envelope.open .env-flap {
            transform: rotateX(-180deg);
            z-index: 1;
        }

        .envelope.open .wax-seal {
            transform: translateX(-50%) scale(0.8);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Peek hint */
        .peek-hint {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 13px;
            color: #6E5A3E;
            letter-spacing: 0.08em;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .peek-hint.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ── CARD ── */
        .card-container {
            width: 95%;
            max-width: 380px;
            margin-bottom: 0;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 1.0s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.6s ease 0.3s,
                margin-bottom 0.5s ease,
                transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: absolute;
            bottom: 20px;
            left: 2.6%;
            z-index: 2;
            pointer-events: none;
            transform: translateY(0);
        }

        .card-container.open {
            max-height: 900px;
            opacity: 1;
            margin-bottom: 0;
            pointer-events: auto;
            transform: translateY(-215px);
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #DDE3E8;
            box-shadow: 0 12px 40px rgba(46, 74, 98, 0.14);
        }

        /* Card header illustration */
        .card-header {
            position: relative;
            height: 200px;
            background: linear-gradient(135deg, #E4EDF3 0%, #D8E4EC 40%, #EFE6D3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-header-title {
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Noto Serif TC', serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: 0.15em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
            z-index: 2;
        }

        /* Deco SVG */
        .flower-deco {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* Card body */
        .card-body {
            padding: 20px;
        }

        .card-greeting {
            font-family: 'Noto Serif TC', serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--brown);
            line-height: 1.5;
        }

        .card-message {
            font-size: 14px;
            color: #5A4A38;
            margin-bottom: 1rem;
            line-height: 1.6;
            text-align: justify;
        }

        #markdownContent h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--brown);
            margin-bottom: 1rem;
        }

        #markdownContent p {
            margin-bottom: 0.8rem;
        }

        .card-divider {
            border: none;
            border-top: 1px solid var(--navy-light);
            margin: 0 0 1.5rem;
        }

        .card-signature {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sig-flower {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .sig-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 15px;
            color: var(--navy);
            font-weight: 700;
            line-height: 1.5;
        }

        .sig-sub {
            font-size: 12px;
            color: #7A6A54;
            font-weight: 400;
        }

        /* Floating icons animation */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            bottom: -30px;
            font-size: 18px;
            opacity: 0;
            animation: floatUp 2.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0.9;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-90vh) scale(1) rotate(20deg);
                opacity: 0;
            }
        }

        /* Close hint */
        .close-hint {
            text-align: center;
            margin: 0.5rem 0 1rem;
            font-size: 12px;
            color: #7C6A50;
            cursor: pointer;
            letter-spacing: 0.05em;
            opacity: 0;
            transition: opacity 0.5s ease 1s;
            text-decoration: underline;
            text-underline-offset: 3px;
            position: relative;
            z-index: 5;
        }

        .close-hint.show {
            opacity: 1;
        }

        /* Responsive — smaller phones */
        @media (max-width: 360px) {
            .card-body {
                padding: 1.5rem 1.25rem 1.25rem;
            }

            .card-header-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- floating icons layer -->
    <div class="hearts-container" id="hearts"></div>

    <div class="scene">
        <!-- decorative bg shapes -->
        <div class="bg-petal bp1"></div>
        <div class="bg-petal bp2"></div>
        <div class="bg-petal bp3"></div>
        <div class="bg-petal bp4"></div>

        <!-- Envelope -->
        <div class="envelope-wrap">
            <p class="close-hint" id="closeHint" onclick="closeCard()"> ↓ 收回信封</p>
            <!-- Envelope (Move to bottom) -->
            <div class="envelope" id="envelope" onclick="openCard()" role="button" aria-label="點擊開啟父親節賀卡">
                <!-- Card inside (Move to top) -->
                <div class="card-container" id="cardContainer">
                    <div class="card">

                        <!-- Header with illustration -->
                        <div class="card-header">
                            <svg class="flower-deco" viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg">
                                <!-- Leaves / stems -->
                                <ellipse cx="130" cy="140" rx="35" ry="14" fill="#8FAE93" opacity="0.6"
                                    transform="rotate(-35 130 140)" />
                                <ellipse cx="250" cy="145" rx="30" ry="12" fill="#799B7E" opacity="0.55"
                                    transform="rotate(30 250 145)" />
                                <ellipse cx="190" cy="155" rx="20" ry="8" fill="#A3C1A7" opacity="0.5"
                                    transform="rotate(-5 190 155)" />
                                <line x1="150" y1="160" x2="155" y2="80" stroke="#799B7E" stroke-width="2"
                                    opacity="0.55" />
                                <line x1="195" y1="160" x2="195" y2="60" stroke="#87A78B" stroke-width="2.5"
                                    opacity="0.6" />
                                <line x1="235" y1="160" x2="228" y2="85" stroke="#799B7E" stroke-width="2"
                                    opacity="0.55" />

                                <!-- Tie shape (left) -->
                                <g transform="translate(155,75)">
                                    <polygon points="-8,-14 8,-14 5,-2 0,6 -5,-2" fill="#2E4A62" opacity="0.8" />
                                    <polygon points="-5,-2 5,-2 8,40 0,50 -8,40" fill="#3E5F7D" opacity="0.75" />
                                    <circle cx="0" cy="-18" r="6" fill="#B8863E" opacity="0.85" />
                                </g>

                                <!-- Compass / star (center, big) -->
                                <g transform="translate(195,55)">
                                    <circle cx="0" cy="0" r="24" fill="none" stroke="#B8863E" stroke-width="2"
                                        opacity="0.7" />
                                    <circle cx="0" cy="0" r="16" fill="none" stroke="#2E4A62" stroke-width="1.5"
                                        opacity="0.5" />
                                    <polygon points="0,-20 4,-4 20,0 4,4 0,20 -4,4 -20,0 -4,-4" fill="#B8863E"
                                        opacity="0.85" />
                                    <circle cx="0" cy="0" r="5" fill="#2E4A62" />
                                </g>

                                <!-- Pipe / leaf shape (right) -->
                                <g transform="translate(228,90)">
                                    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#87A78B" opacity="0.75" />
                                    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#9DBE9F" opacity="0.65"
                                        transform="rotate(90)" />
                                    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#87A78B" opacity="0.75"
                                        transform="rotate(180)" />
                                    <ellipse cx="0" cy="-16" rx="9" ry="16" fill="#9DBE9F" opacity="0.65"
                                        transform="rotate(270)" />
                                    <circle cx="0" cy="0" r="9" fill="#B8863E" opacity="0.85" />
                                    <circle cx="0" cy="0" r="5" fill="#9A6E2F" />
                                </g>

                                <!-- Small scattered accents -->
                                <circle cx="80" cy="40" r="5" fill="#A9C2D6" opacity="0.5" />
                                <circle cx="88" cy="52" r="3" fill="#2E4A62" opacity="0.4" />
                                <circle cx="300" cy="35" r="4" fill="#A9C2D6" opacity="0.5" />
                                <circle cx="315" cy="50" r="3" fill="#2E4A62" opacity="0.4" />
                                <circle cx="60" cy="90" r="4" fill="#B8863E" opacity="0.4" />
                                <circle cx="320" cy="90" r="5" fill="#B8863E" opacity="0.4" />

                                <!-- Small stars -->
                                <text x="70" y="65" font-size="14" fill="#B8863E" opacity="0.45"
                                    text-anchor="middle">★</text>
                                <text x="310" y="70" font-size="12" fill="#B8863E" opacity="0.4"
                                    text-anchor="middle">★</text>
                            </svg>
                            <div class="card-header-title">父親節快樂</div>
                        </div>

                        <!-- Card body text -->
                        <div class="card-body">
                            <div id="markdownContent" class="card-message">
                                <!-- Markdown will be injected here -->
                            </div>
                            <hr class="card-divider">
                            <div class="card-signature">
                                <svg class="sig-flower" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
                                    <g transform="translate(18,18)">
                                        <circle cx="0" cy="0" r="15" fill="none" stroke="#B8863E" stroke-width="1.5" />
                                        <polygon points="0,-11 2.5,-2.5 11,0 2.5,2.5 0,11 -2.5,2.5 -11,0 -2.5,-2.5"
                                            fill="#2E4A62" />
                                        <circle cx="0" cy="0" r="3" fill="#B8863E" />
                                    </g>
                                </svg>
                                <div>
                                    <div class="sig-text">獻上滿滿的敬愛 ★</div>
                                    <div class="sig-sub">寶貝綸親筆</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="env-body"></div>
                <div class="env-left"></div>
                <div class="env-right"></div>
                <div class="env-bottom"></div>
                <div class="env-flap">
                    <div class="env-flap-inner"></div>
                    <div class="env-flap-front"></div>
                </div>
                <div class="wax-seal">★</div>
            </div>
            <p class="peek-hint" id="peekHint">✦ 給親愛的爸 。 輕觸打開 ✦</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let isOpen = false;

        // Content management
        const config = {
            dad: { file: 'dad.md', hint: '✦ 給親愛的爸 。 輕觸打開 ✦' },
            grandpa: { file: 'grandpa.md', hint: '✦ 給親愛的爺爺 。 輕觸打開 ✦' }
        };

        async function loadContent() {
            const hash = window.location.hash.replace('#', '');
            const settings = config[hash];
            const envWrap = document.querySelector('.envelope-wrap');

            // 單純訪問無效，須有正確的 hash
            if (!settings) {
                envWrap.style.display = 'none';
                const msg = document.createElement('div');
                msg.style.cssText = "position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#2E4A62; font-family:'Noto Serif TC',serif; font-size:18px; font-weight:700; letter-spacing:0.1em; z-index:100; text-align:center; line-height:1.8;";
                msg.innerHTML = "這是一份專屬的賀卡<br>請使用正確的連結開啟";
                document.body.appendChild(msg);
                return;
            }

            document.getElementById('peekHint').textContent = settings.hint;

            try {
                const response = await fetch(settings.file);
                if (!response.ok) throw new Error('File not found');
                const text = await response.text();
                document.getElementById('markdownContent').innerHTML = marked.parse(text);
            } catch (err) {
                console.error('Failed to load markdown:', err);
                document.getElementById('markdownContent').innerHTML = '<p>內容載入失敗，請稍後再試。</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadContent);

        function openCard() {
            if (isOpen) return;
            isOpen = true;

            const env = document.getElementById('envelope');
            const container = document.getElementById('cardContainer');
            const hint = document.getElementById('peekHint');
            const closeHint = document.getElementById('closeHint');

            const envWrap = document.querySelector('.envelope-wrap');

            env.classList.add('open');
            envWrap.classList.add('up');
            hint.classList.add('hidden');

            setTimeout(() => {
                container.classList.add('open');
            }, 500);

            setTimeout(() => {
                closeHint.classList.add('show');
            }, 1800);

            launchHearts();
        }

        function closeCard() {
            if (!isOpen) return;
            isOpen = false;

            const env = document.getElementById('envelope');
            const container = document.getElementById('cardContainer');
            const hint = document.getElementById('peekHint');
            const closeHint = document.getElementById('closeHint');

            const envWrap = document.querySelector('.envelope-wrap');

            container.classList.remove('open');
            closeHint.classList.remove('show');

            // 等待卡片收納動畫完成 (約 1000ms) 再關閉信封
            setTimeout(() => {
                env.classList.remove('open');
                envWrap.classList.remove('up');
                hint.classList.remove('hidden');
            }, 1000);
        }

        function launchHearts() {
            const container = document.getElementById('hearts');
            const symbols = ['★', '✦', '♦', '★', '✧', '♦'];
            const colors = ['#2E4A62', '#3E5F7D', '#B8863E', '#4F6B52', '#A9C2D6', '#9A6E2F'];
            const count = 18;

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('span');
                    el.className = 'heart';
                    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    el.style.left = (10 + Math.random() * 80) + '%';
                    el.style.fontSize = (14 + Math.random() * 14) + 'px';
                    el.style.color = colors[Math.floor(Math.random() * colors.length)];
                    el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
                    el.style.animationDelay = (Math.random() * 0.3) + 's';
                    container.appendChild(el);
                    setTimeout(() => el.remove(), 3500);
                }, i * 80);
            }
        }

        // 強制禁用右鍵、複製與剪切
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
    </script>
</body>

</html>
